# Docker Compose modo PRODUCCIÓN (Backend Prod + Frontend Prod Nginx conectados a Supabase PostgreSQL)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sgb_backend_prod
    restart: always
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sgb_frontend_prod
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
