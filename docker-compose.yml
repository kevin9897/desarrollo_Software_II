services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sgb_backend
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sgb_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
