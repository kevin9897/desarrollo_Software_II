# Docker Compose modo DESARROLLO (Backend Dev + Frontend Dev conectados a Supabase PostgreSQL)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sgb_backend_dev
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sgb_frontend_dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
