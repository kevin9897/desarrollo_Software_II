# Docker Compose modo DESARROLLO (Orquestación completa: DB + Backend Dev + Frontend Dev)
services:
  db:
    image: postgres:16-alpine
    container_name: sgb_db_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgb123}
      POSTGRES_DB: ${POSTGRES_DB:-sgb_madeira}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgb}"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sgb_backend_dev
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sgb:sgb123@db:5432/sgb_madeira}
      SECRET_KEY: ${SECRET_KEY:-clave_desarrollo_madeira}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sgb_frontend_dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata_dev:
